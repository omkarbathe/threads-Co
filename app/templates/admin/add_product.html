{% extends "admin_base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Navigation -->
    <div class="mb-8">
        <a href="{{ url_for('admin.dashboard') }}" class="text-[10px] uppercase tracking-widest text-stone-400 hover:text-black transition-colors flex items-center">
            <i data-lucide="arrow-left" class="w-3 h-3 mr-2"></i>
            Back to Dashboard
        </a>
    </div>

    <div class="bg-white border border-stone-100 rounded-sm shadow-sm p-10">
        <header class="mb-12 border-b border-stone-50 pb-8">
            <h1 class="text-2xl font-light tracking-tight text-stone-800">Register New Piece</h1>
            <p class="text-[10px] uppercase tracking-[0.2em] text-stone-400 mt-2">Atelier Inventory • Multi-Size Entry</p>
        </header>

        <form action="{{ url_for('admin.add_product') }}" method="POST" class="space-y-10">
            
            <!-- Basic Info -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-2">
                    <label class="text-[9px] uppercase tracking-widest text-stone-500 font-bold">Product Name</label>
                    <input type="text" name="name" placeholder="e.g. Silk Evening Gown" required
                        class="w-full border-b border-stone-200 focus:border-black transition-colors py-3 text-sm outline-none bg-transparent">
                </div>

                <div class="space-y-2">
                    <label class="text-[9px] uppercase tracking-widest text-stone-500 font-bold">Category</label>
                    <select name="category_id" required
                        class="w-full border-b border-stone-200 focus:border-black transition-colors py-3 text-sm outline-none bg-transparent">
                        <option value="" disabled selected>Select Category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-2">
                    <label class="text-[9px] uppercase tracking-widest text-stone-500 font-bold">Price ($)</label>
                    <input type="number" step="0.01" name="price" placeholder="0.00" required
                        class="w-full border-b border-stone-200 focus:border-black transition-colors py-3 text-sm outline-none bg-transparent">
                </div>

                <div class="space-y-2">
                    <label class="text-[9px] uppercase tracking-widest text-stone-500 font-bold">Target Gender</label>
                    <div class="flex space-x-6 py-3">
                        <label class="flex items-center text-[10px] uppercase tracking-widest cursor-pointer">
                            <input type="radio" name="gender" value="men" class="mr-2 accent-black" required> Men
                        </label>
                        <label class="flex items-center text-[10px] uppercase tracking-widest cursor-pointer">
                            <input type="radio" name="gender" value="women" class="mr-2 accent-black"> Women
                        </label>
                    </div>
                </div>
            </div>

            <!-- Dynamic Inventory Section -->
            <div class="pt-8 border-t border-stone-50 space-y-6">
                <div class="flex justify-between items-center">
                    <label class="text-[9px] uppercase tracking-widest text-stone-500 font-bold">Size-Wise Inventory</label>
                    <button type="button" onclick="addSizeRow()" class="text-[10px] font-bold text-stone-900 border-b border-black uppercase tracking-tighter hover:opacity-60 transition">
                        + Add Size
                    </button>
                </div>

                <div id="size-container" class="space-y-4">
                    <!-- Default Row -->
                    <div class="flex items-center space-x-4">
                        <input type="text" name="sizes[]" placeholder="Size (S, M, L...)" required
                            class="flex-1 border-b border-stone-200 focus:border-black py-2 text-sm outline-none bg-transparent">
                        <input type="number" name="stocks[]" placeholder="Qty" required
                            class="w-32 border-b border-stone-200 focus:border-black py-2 text-sm outline-none bg-transparent">
                        <div class="w-10"></div> <!-- Spacer for Delete Align -->
                    </div>
                </div>
            </div>

            <!-- Narrative -->
            <div class="space-y-2">
                <label class="text-[9px] uppercase tracking-widest text-stone-500 font-bold">Image URL</label>
                <input type="url" name="image_url" placeholder="https://res.cloudinary.com/..." required
                    class="w-full border-b border-stone-200 focus:border-black transition-colors py-3 text-sm outline-none bg-transparent">
            </div>

            <div class="space-y-2">
                <label class="text-[9px] uppercase tracking-widest text-stone-500 font-bold">Atelier Story / Description</label>
                <textarea name="description" rows="4" placeholder="Detail the craft, material, and fit..." required
                    class="w-full border border-stone-100 bg-stone-50 focus:bg-white focus:border-black transition-all p-4 text-sm outline-none"></textarea>
            </div>

            <!-- Actions -->
            <div class="pt-6 flex items-center justify-end space-x-8">
                <a href="{{ url_for('admin.dashboard') }}" class="text-[10px] uppercase tracking-widest text-stone-400 hover:text-black">Cancel</a>
                <button type="submit" class="bg-black text-white px-10 py-4 text-[10px] uppercase tracking-[0.3em] font-bold hover:bg-stone-800 transition-all shadow-lg">
                    Register Piece
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Dynamic Row Script -->
<script>
function addSizeRow() {
    const container = document.getElementById('size-container');
    const newRow = document.createElement('div');
    newRow.className = 'flex items-center space-x-4 mt-4';
    newRow.innerHTML = `
        <input type="text" name="sizes[]" placeholder="Size" required
            class="flex-1 border-b border-stone-200 focus:border-black py-2 text-sm outline-none bg-transparent">
        <input type="number" name="stocks[]" placeholder="Qty" required
            class="w-32 border-b border-stone-200 focus:border-black py-2 text-sm outline-none bg-transparent">
        <button type="button" onclick="this.parentElement.remove()" class="w-10 text-stone-300 hover:text-red-500 text-lg">✕</button>
    `;
    container.appendChild(newRow);
}
</script>
{% endblock %}
