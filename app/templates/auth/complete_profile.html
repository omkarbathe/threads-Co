{% extends "base.html" %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-20 px-6">
    <div class="max-w-md w-full">
        <h1 class="text-2xl font-light tracking-widest uppercase mb-8 text-center">Edit Profile</h1>

        <form method="POST" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[9px] uppercase tracking-widest text-stone-400">First Name</label>
                    <input type="text" name="first_name" value="{{ user.first_name or '' }}" required 
                           class="w-full bg-stone-50 border-none px-4 py-3 text-xs focus:ring-1 focus:ring-black">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] uppercase tracking-widest text-stone-400">Last Name</label>
                    <input type="text" name="last_name" value="{{ user.last_name or '' }}" required 
                           class="w-full bg-stone-50 border-none px-4 py-3 text-xs focus:ring-1 focus:ring-black">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[9px] uppercase tracking-widest text-stone-400">Contact Number</label>
                <input type="tel" name="phone" value="{{ user.phone or '' }}" required 
                       class="w-full bg-stone-50 border-none px-4 py-3 text-xs focus:ring-1 focus:ring-black">
            </div>

            <div class="space-y-1">
                <label class="text-[9px] uppercase tracking-widest text-stone-400">Shipping Address</label>
                <textarea name="address" required rows="3" 
                          class="w-full bg-stone-50 border-none px-4 py-3 text-xs focus:ring-1 focus:ring-black">{{ user.address or '' }}</textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[9px] uppercase tracking-widest text-stone-400">City</label>
                    <input type="text" name="city" value="{{ user.city or '' }}" required 
                           class="w-full bg-stone-50 border-none px-4 py-3 text-xs focus:ring-1 focus:ring-black">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] uppercase tracking-widest text-stone-400">Pincode</label>
                    <input type="text" name="pincode" value="{{ user.pincode or '' }}" required 
                           class="w-full bg-stone-50 border-none px-4 py-3 text-xs focus:ring-1 focus:ring-black">
                </div>
            </div>

            <button type="submit" class="w-full bg-black text-white py-4 text-[10px] uppercase tracking-[0.3em] font-bold hover:bg-stone-800 transition-colors">
                Save Changes
            </button>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('main.profile') }}" class="text-[9px] uppercase tracking-widest text-stone-400 hover:text-black">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
