<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Threads & Co.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-stone-50 text-stone-900 flex min-h-screen">

    <!-- LEFT SIDEBAR -->
    <aside class="w-64 bg-white border-r border-stone-200 flex flex-col sticky top-0 h-screen">
        <div class="p-8 border-b border-stone-100 text-center">
            <h1 class="text-sm font-bold tracking-[0.3em] uppercase">Admin Portal</h1>
        </div>

        <nav class="flex-grow p-6 space-y-2">
            <a href="{{ url_for('admin.dashboard') }}"
                class="flex items-center space-x-3 p-3 rounded-lg text-[10px] uppercase tracking-widest font-bold hover:bg-stone-100 transition-colors">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                <span>Main Dashboard</span>
            </a>
            <a href="{{ url_for('admin.add_product') }}"
                class="flex items-center space-x-3 p-3 rounded-lg text-[10px] uppercase tracking-widest font-bold hover:bg-stone-100 transition-colors">
                <i data-lucide="plus-square" class="w-4 h-4"></i>
                <span>Add Product</span>
            </a>
            <a href="{{ url_for('admin.stock_management') }}"
                class="flex items-center space-x-3 p-3 rounded-lg text-[10px] uppercase tracking-widest font-bold hover:bg-stone-100 transition-colors">
                <i data-lucide="package" class="w-4 h-4"></i>
                <span>Stock Links</span>
            </a>
            <a href="{{ url_for('admin.view_feedback') }}"
                class="flex items-center space-x-3 p-3 rounded-lg text-[10px] uppercase tracking-widest font-bold hover:bg-stone-100 transition-colors">
                <i data-lucide="message-square" class="w-4 h-4"></i>
                <span>User Feedback</span>
            </a>
        </nav>

        <div class="p-6 border-t border-stone-100">
            <a href="{{ url_for('auth.logout') }}"
                class="flex items-center space-x-3 p-3 text-[10px] uppercase tracking-widest font-bold text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span>Exit Portal</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-grow p-10 overflow-y-auto">
        <main class="flex-grow p-10 overflow-y-auto">
            <!-- FLASH MESSAGES BLOCK -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="mb-8 space-y-2">
                {% for category, message in messages %}
                <div class="p-4 text-[10px] uppercase tracking-[0.2em] font-bold flex justify-between items-center animate-fade-in
                {% if category == 'success' %} bg-stone-900 text-white {% else %} bg-red-50 text-red-600 {% endif %}">
                    <span>{{ message }}</span>
                    <button onclick="this.parentElement.remove()" class="opacity-50 hover:opacity-100">✕</button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>

        <script>lucide.createIcons();</script>
</body>

</html>
